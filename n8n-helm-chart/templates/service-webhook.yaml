{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: n8n-webhook-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.webhook.service.type }}
  selector:
    app: n8n-webhook
  ports:
  - name: http
    port: {{ .Values.webhook.service.port }}
    targetPort: {{ .Values.webhook.service.targetPort }}
{{- end }}
