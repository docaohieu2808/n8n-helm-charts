metadata:
  name: n8n-webhook-service
  namespace: n8n
spec:
  selector:
    app: n8n-webhook
  ports:
  - name: http
    port: 80
    targetPort: 5678

---
# PostgreSQL and Redis StatefulSets removed - using HA versions in architecture namespace

---
# n8n-worker-hpa
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: n8n-worker-hpa
  namespace: n8n
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: n8n-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# n8n-webhook-hpa
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: n8n-webhook-hpa
  namespace: n8n
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: n8n-webhook
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# n8n-ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
  annotations:
    traefik.ingress.kubernetes.io/preserve-host: "true"
spec:
  ingressClassName: traefik-ingress
  rules:
  - host: auto.docaohieu.com
    http:
      paths:
      # Webhook paths - route to webhook service
      - path: /webhook
        pathType: Prefix
        backend:
          service:
            name: n8n-webhook-service
            port:
              number: 80
      - path: /webhook-test
        pathType: Prefix
        backend:
          service:
            name: n8n-webhook-service
            port:
              number: 80
      - path: /webhook-waiting
        pathType: Prefix
        backend:
          service:
            name: n8n-webhook-service
            port:
              number: 80
      # All other paths - route to main service (UI)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n-main-service
            port:
              number: 80
