              key: NODE_TLS_REJECT_UNAUTHORIZED
        volumeMounts:
        - name: n8n-main-files
          mountPath: /home/node/.n8n
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        startupProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 0
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: n8n-main-files
        persistentVolumeClaim:
          claimName: n8n-main-pvc

---
# n8n-main service
apiVersion: v1
kind: Service
metadata:
  name: n8n-main-service
  namespace: n8n
spec:
  selector:
    app: n8n-main
  ports:
  - name: http
    port: 80
    targetPort: 5678
  - name: metrics
    port: 9090
    targetPort: 5678

---
# n8n-config config map
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
data:
  # Basic config
  N8N_HOST: "auto.docaohieu.com"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"
  WEBHOOK_URL: "https://auto.docaohieu.com"
  GENERIC_TIMEZONE: "Asia/Ho_Chi_Minh"

  # Database config (PostgreSQL HA)
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres-ha.database.svc.cluster.local"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n_postgres_db"
  DB_POSTGRESDB_USER: "n8n_postgres_user"
  DB_POSTGRESDB_SCHEMA: "public"
  # Connection Pool Optimization
  DB_POSTGRESDB_POOL_SIZE: "20"
  DB_POSTGRESDB_MIN_POOL_SIZE: "5"
  DB_POSTGRESDB_ACQUIRE_TIMEOUT_MILLIS: "10000"
  DB_POSTGRESDB_CONNECTION_TIMEOUT_MILLIS: "5000"
  DB_POSTGRESDB_IDLE_TIMEOUT_MILLIS: "30000"
  DB_POSTGRESDB_MAX_USES: "7500"
  # SSL enabled (required by PostgreSQL server)
  DB_POSTGRESDB_SSL_ENABLED: "true"
  DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

  # Redis config for queue mode (Redis HA)
  QUEUE_BULL_REDIS_HOST: "redis-ha-haproxy.database.svc.cluster.local"
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_DB: "1"

  # Execution config
  EXECUTIONS_MODE: "queue"
  EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
  EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"

  # Logging
  N8N_LOG_LEVEL: "warn"
  N8N_LOG_OUTPUT: "console"

  # Metrics
  N8N_METRICS: "true"
  N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
  N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
  N8N_METRICS_INCLUDE_NODE_TYPE_LABEL: "true"

  # Performance
  N8N_CONCURRENCY_PRODUCTION_LIMIT: "10"

  # Caching (improves response time)
  N8N_CACHE_ENABLED: "true"
  N8N_USER_MANAGEMENT_JWT_SECRET_CACHE_ENABLED: "true"
  CACHE_REDIS_HOST: "redis-ha-haproxy.database.svc.cluster.local"
  CACHE_REDIS_PORT: "6379"
  CACHE_REDIS_DB: "2"

  # Trust proxy for reverse proxy (use number for Express)
  N8N_TRUST_PROXY: "1"

